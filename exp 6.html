
<!DOCTYPE html>
<html>
<head>
<title>Task Manager</title>

<style>
body {
    font-family: Arial;
    background: #e3f2fd;
    text-align: center;
}

.container {
    background: white;
    width: 350px;
    margin: 80px auto;
    padding: 25px;
    border-radius: 10px;
}

input {
    padding: 10px;
    width: 55%;
}

button {
    padding: 10px;
    background: blue;
    color: white;
    border: none;
    cursor: pointer;
    margin: 3px;
}

li {
    padding: 10px;
    text-align: left;
}
</style>
</head>

<body>

<div class="container">
    <h1>Task Manager</h1>

    <input id="task" placeholder="Enter Task">
    <button onclick="addTask()">Add</button>

    <ul id="list"></ul>
</div>

<script>

// Display tasks
async function loadTasks() {
    const res = await fetch("/tasks");
    const tasks = await res.json();

    document.getElementById("list").innerHTML = "";

    tasks.forEach(t => {
        const li = document.createElement("li");
        li.append(document.createTextNode(t.name + " "));

        const edit = document.createElement("button");
        edit.textContent = "Edit";
        edit.onclick = () => updateTask(t.id, t.name);

        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = () => deleteTask(t.id);

        li.append(edit, del);
        document.getElementById("list").appendChild(li);
    });
}

// Add task
async function addTask() {
    const name = document.getElementById("task").value.trim();

    if (!name) {
        alert("Enter a task");
        return;
    }

    await fetch("/tasks", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name})
    });

    document.getElementById("task").value = "";
    loadTasks();
}

// Update task
async function updateTask(id, oldName) {
    const name = prompt("Enter new task", oldName);

    if (!name || !name.trim()) return;

    await fetch("/tasks/" + id, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name: name.trim()})
    });

    loadTasks();
}

// Delete task
async function deleteTask(id) {
    await fetch("/tasks/" + id, {
        method: "DELETE"
    });

    loadTasks();
}

loadTasks();

</script>

</body>
</html>
